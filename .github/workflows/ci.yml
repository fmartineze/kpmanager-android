name: CI

on: [push, pull_request]

jobs:
  test:
    # La lógica (Rust) se prueba en el equipo de compilación; lo específico de Android (plugins Kotlin) no se
    # compila aquí: necesitaría el SDK y el NDK.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: npm ci
      - run: npm run build
      - run: cargo test
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  audit:
    runs-on: ubuntu-latest
    # rustsec/audit-check publica el resultado como un «check run» y necesita este permiso.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
